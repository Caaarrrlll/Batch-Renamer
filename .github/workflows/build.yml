name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The app reports the pubspec version to the update checker, so a
      # release tag must match it.
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          pubspec_version=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version: *([^+ ]+).*/\1/')
          tag_version=${GITHUB_REF_NAME#v}
          if [ "$pubspec_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec.yaml version $pubspec_version. Bump the version in pubspec.yaml and tag again."
            exit 1
          fi

  build-windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run msix:create --install-certificate false
      - uses: actions/upload-artifact@v6
        with:
          name: windows-build
          path: build/windows/x64/runner/Release/msix/

  build-linux:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: sudo apt-get update
      - run: sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v6
        with:
          name: linux-build
          path: build/linux/x64/release/bundle/

  build-macos:
    needs: check-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build macos --release
      - uses: actions/upload-artifact@v6
        with:
          name: macos-build
          path: build/macos/Build/Products/Release/

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
      - run: |
          cd linux-build
          zip -r ../BulkRenamer-Linux.zip .
          cd ../macos-build
          zip -r ../BulkRenamer-macOS.zip .
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            windows-build/*.msix*
            BulkRenamer-Linux.zip
            BulkRenamer-macOS.zip
